name: Build MailLT APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "build/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MailLT source
        run: unzip -q MailLT-build-src.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: MailLT
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK name
        run: cp MailLT/app/build/outputs/apk/debug/app-debug.apk MailLT-1.2-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailLT-1.2-debug-apk
          path: MailLT-1.2-debug.apk
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.2 --yes --cleanup-tag || true
          gh release create v1.2 MailLT-1.2-debug.apk --title "MailLT 1.2" --notes "Naujas Edison Mail stiliaus dizainas, tamsus navigacijos meniu, HTML laiškų rodymas, HTML siuntimas, išorinių paveikslėlių nustatymas, modernesnis Inbox ir nustatymų ekranas." --target "$GITHUB_SHA"
