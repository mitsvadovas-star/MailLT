name: Build Edgaro appsas APK

on:
  workflow_dispatch:
  push:
    branches: [ "build/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild MailLT source archive
        run: |
          cat .buildsrc/part* > source.b64
          base64 -d source.b64 > MailLT-build-src.zip
          unzip -t MailLT-build-src.zip
          unzip -q MailLT-build-src.zip

      - name: Apply MailLT 1.5 patch
        run: |
          cat .patches/1.5/part* > /tmp/maillt-1.5.patch.gz.b64
          base64 -d /tmp/maillt-1.5.patch.gz.b64 | gzip -d > /tmp/maillt-1.5.patch
          patch --batch -p1 < /tmp/maillt-1.5.patch

      - name: Rename all user-visible branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('MailLT/app/src/main')
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.java', '.xml'}:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              new = text.replace('Mail LT', 'Edgaro appsas')
              if new != text:
                  p.write_text(new, encoding='utf-8')
                  changed.append(str(p))
          strings = Path('MailLT/app/src/main/res/values/strings.xml')
          if strings.exists():
              text = strings.read_text(encoding='utf-8')
              if 'Edgaro appsas' not in text:
                  raise SystemExit('app_name rename failed')
          print('Renamed files:')
          print('\n'.join(changed))
          PY

      - name: Verify old branding is gone from app UI sources
        run: |
          if grep -RIn --include='*.java' --include='*.xml' 'Mail LT' MailLT/app/src/main; then
            echo 'Old visible Mail LT branding still exists'
            exit 1
          fi

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" > MailLT/gradle.properties
          echo "android.enableJetifier=true" >> MailLT/gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: MailLT
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK name
        run: cp MailLT/app/build/outputs/apk/debug/app-debug.apk Edgaro-appsas-1.6-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: Edgaro-appsas-1.6-debug-apk
          path: Edgaro-appsas-1.6-debug.apk
          if-no-files-found: error
