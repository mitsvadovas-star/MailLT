name: Build MailLT APK

on:
  workflow_dispatch:
  push:
    branches: [ "build/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild MailLT source archive
        run: |
          cat .buildsrc/part* > source.b64
          base64 -d source.b64 > MailLT-build-src.zip
          unzip -t MailLT-build-src.zip
          unzip -q MailLT-build-src.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: MailLT
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK name
        run: cp MailLT/app/build/outputs/apk/debug/app-debug.apk MailLT-1.3-debug.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: MailLT-1.3-debug-apk
          path: MailLT-1.3-debug.apk
          if-no-files-found: error
